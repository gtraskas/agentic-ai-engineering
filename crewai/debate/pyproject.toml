[project]
name = "debate"
version = "0.1.0"
description = "Two-agent debate crew: argue both sides of a motion, then judge the winner"
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4",
]

[project.scripts]
debate = "debate.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
