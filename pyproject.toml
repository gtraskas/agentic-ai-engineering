[project]
name = "agentic-ai-engineering"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "gradio>=6.20.0",
    "ipykernel>=7.3.0",
    "modal>=1.5.2",
    "openai>=2.46.0",
    "openai-agents>=0.18.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "qdrant-client[fastembed]>=1.18.0",
]

[dependency-groups]
dev = [
    "ruff==0.16.0",
]

[tool.ruff.lint.isort]
# The crewai/ folder holds CrewAI projects; the name must not make ruff
# mistake the third-party `crewai` package for first-party code.
known-third-party = ["crewai"]
